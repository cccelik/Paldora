name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PALDORA_ENV: local
  NEXT_PUBLIC_WEB_URL: http://127.0.0.1:3200
  FIREBASE_PROJECT_ID: demo-paldora
  FIREBASE_WEB_API_KEY: demo-api-key

jobs:
  validate:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm tokens:check
      - run: pnpm contract:native:check
      - run: pnpm firebase:parity:check
      - run: pnpm build
      - run: pnpm scan:client-bundle

  firebase:
    name: Firebase rules, trusted services, Functions and browser
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm firebase:rules:check
      - run: pnpm firebase:prototype:test
      - run: pnpm firebase:trusted:test
      - run: pnpm firebase:native:test
      - run: pnpm firebase:local:flow:test
      - run: pnpm firebase:web:local:test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-browser-traces
          path: test-results
          retention-days: 7

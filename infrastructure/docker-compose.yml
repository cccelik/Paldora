# Local development services only. Credentials here are deliberately weak and
# marked dev_only; the config parsers reject them in staging and production.
# Distinct from the legacy build's `paldora` project so volumes never mix.
name: paldora-v2

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paldora
      POSTGRES_USER: paldora
      POSTGRES_PASSWORD: paldora_dev_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - paldora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paldora -d paldora']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # BullMQ requires noeviction; AOF keeps queued jobs across restarts.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - paldora-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Private S3-compatible storage for media (used from Phase 1).
  minio:
    # Official minio/minio images left Docker Hub and Quay in 2025; this is the
    # Chainguard build, pinned by digest (it has no shell and no mc).
    image: cgr.dev/chainguard/minio@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: paldora_minio
      MINIO_ROOT_PASSWORD: paldora_minio_dev_only
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://127.0.0.1:3000,http://127.0.0.1:3100
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - paldora-s3:/data

  # The bucket is created with a signed (SigV4) request: no mc is needed.
  # A new bucket is private by default.
  minio-init:
    image: curlimages/curl:8.14.1
    depends_on:
      - minio
    restart: 'no'
    entrypoint:
      - /bin/sh
      - -c
      - >-
        for attempt in $$(seq 1 30); do
        curl -fs http://minio:9000/minio/health/ready && break; sleep 1; done &&
        curl -fsS -X PUT --aws-sigv4 aws:amz:us-east-1:s3
        --user paldora_minio:paldora_minio_dev_only
        http://minio:9000/paldora-private ||
        curl -fsS -I --aws-sigv4 aws:amz:us-east-1:s3
        --user paldora_minio:paldora_minio_dev_only
        http://minio:9000/paldora-private

volumes:
  paldora-postgres:
  paldora-redis:
  paldora-s3:

# Local development services only. Credentials here are deliberately weak and
# marked dev_only; the config parsers reject them in staging and production.
# Distinct from the legacy build's `paldora` project so volumes never mix.
name: paldora-v2

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paldora
      POSTGRES_USER: paldora
      POSTGRES_PASSWORD: paldora_dev_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - paldora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paldora -d paldora']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # BullMQ requires noeviction; AOF keeps queued jobs across restarts.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - paldora-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Private S3-compatible storage for media (used from Phase 1).
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: paldora_minio
      MINIO_ROOT_PASSWORD: paldora_minio_dev_only
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://127.0.0.1:3000,http://127.0.0.1:3100
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - paldora-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 paldora_minio paldora_minio_dev_only &&
        mc mb --ignore-existing local/paldora-private &&
        mc anonymous set none local/paldora-private

volumes:
  paldora-postgres:
  paldora-redis:
  paldora-minio:

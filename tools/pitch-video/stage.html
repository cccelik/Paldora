<!doctype html>
<meta charset="utf-8" />
<body>
  <script>
    // Frame compositor: window.init(cfg), then await window.frame(t) for each output frame.
    // Everything is a pure function of time t, so renders are deterministic.
    const C = {
      canvas: '#14110E',
      text: '#F2EBDF',
      secondary: '#C9BDAB',
      brass: '#C39A52',
      brassText: '#D9B26A',
    };
    const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
    const outCubic = (u) => 1 - (1 - u) ** 3;
    const smooth = (u) => u * u * (3 - 2 * u);
    const RV = 0.65; // phrase reveal time (s)
    const XF = 0.45; // group crossfade (s)
    let cfg,
      root,
      els = {};

    function el(tag, css, parent = root, text) {
      const e = document.createElement(tag);
      e.style.cssText = css;
      if (text !== undefined) e.textContent = text;
      parent.appendChild(e);
      return e;
    }

    window.init = async (c) => {
      cfg = c;
      const f = c.fonts;
      const st = document.createElement('style');
      st.textContent = `
  @font-face{font-family:Fraunces;src:url('file://${f}/Fraunces-Variable.woff2');font-weight:100 900;font-style:normal}
  @font-face{font-family:Fraunces;src:url('file://${f}/Fraunces-Italic-Variable.woff2');font-weight:100 900;font-style:italic}
  @font-face{font-family:Geist;src:url('file://${f}/Geist-Variable.woff2');font-weight:100 900}
  html,body{margin:0;background:${C.canvas};overflow:hidden}`;
      document.head.appendChild(st);
      await Promise.all(
        [
          '300 80px Fraunces',
          'italic 300 80px Fraunces',
          '500 30px Geist',
          '600 30px Geist',
        ].map((x) => document.fonts.load(x)),
      );
      document.body.style.cssText = `margin:0;width:${c.W}px;height:${c.H}px;position:relative;overflow:hidden;background:${C.canvas}`;
      root = document.body;
      els.bg = el(
        'div',
        `position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 45%,#271f18 0%,${C.canvas} 72%)`,
      );
      els.ring = el(
        'div',
        `position:absolute;left:50%;top:50%;width:${c.H * 0.9}px;height:${c.H * 0.9}px;margin:${-c.H * 0.45}px 0 0 ${-c.H * 0.45}px;border-radius:50%;border:2px solid ${C.brass};opacity:0`,
      );
      els.stars = [];
      for (let i = 0; i < 7; i++) {
        const s = el(
          'div',
          `position:absolute;left:${(i * 137) % 100}%;top:${(i * 59 + 13) % 100}%;width:${16 + (i % 3) * 8}px;height:${16 + (i % 3) * 8}px;color:${C.brass};opacity:.5`,
        );
        s.innerHTML =
          '<svg viewBox="0 0 24 24" width="100%" height="100%"><path fill="currentColor" d="M12 0c.8 6.6 5.4 11.2 12 12-6.6.8-11.2 5.4-12 12-.8-6.6-5.4-11.2-12-12C6.6 11.2 11.2 6.6 12 0z"/></svg>';
        els.stars.push(s);
      }
      els.stage = el('div', 'position:absolute;inset:0');
      els.glow = el(
        'div',
        `position:absolute;inset:0;background:radial-gradient(ellipse 50% 40% at 50% 50%,${C.brass},transparent 70%);opacity:0;pointer-events:none;z-index:50`,
      );
      els.black = el(
        'div',
        'position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60',
      );
    };

    function words(lines, size, align, container, grid) {
      const out = [];
      for (const line of lines) {
        const row = el(
          'div',
          grid
            ? 'display:grid;justify-items:center'
            : `display:flex;flex-wrap:nowrap;gap:${size * 0.24}px;justify-content:${align};white-space:nowrap;line-height:${size * 1.04}px;`,
          container,
        );
        for (const w of line) {
          const span = el(
            'span',
            `display:inline-block;font:${w.a ? 'italic ' : ''}300 ${size * (w.big || 1)}px/${size * 1.04 * (w.big || 1)}px Fraunces;color:${w.a ? C.brassText : C.text};letter-spacing:-.012em;opacity:0${grid ? ';grid-area:1/1' : ''}`,
            row,
            w.t,
          );
          out.push({ span, at: w.at });
        }
      }
      return out;
    }

    /** Build one group's DOM inside its own layer (kept until the group has faded out). */
    function build(g) {
      const P = cfg.portrait;
      g.root = el('div', 'position:absolute;inset:0;opacity:0', els.stage);
      g.w = [];
      if (g.hl) {
        const h = g.hl;
        const box = el(
          'div',
          `position:absolute;left:${h.x}px;top:${h.y}px;width:${h.w}px;height:${h.h}px;display:flex;flex-direction:column;justify-content:${h.vj || 'center'};align-items:${h.align === 'center' ? 'center' : 'flex-start'};gap:${h.size * 0.28}px`,
          g.root,
        );
        const inner = el(
          'div',
          `display:flex;flex-direction:column;gap:${h.size * 0.02}px;align-items:${h.align === 'center' ? 'center' : 'flex-start'}`,
          box,
        );
        g.w = words(
          h.lines,
          h.size,
          h.align === 'center' ? 'center' : 'flex-start',
          inner,
          g.kind === 'replace',
        );
        if (g.sub)
          g.subEl = el(
            'div',
            `font:500 ${g.sub.size}px/1.35 Geist;color:${C.secondary};opacity:0;max-width:${h.w}px;text-align:${h.align === 'center' ? 'center' : 'left'};letter-spacing:.01em`,
            box,
            g.sub.text,
          );
      }
      if (g.card) {
        const c = g.card;
        g.cardEl = el(
          'div',
          `position:absolute;left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px;border-radius:${c.r}px;overflow:hidden;background:#EAE2D5;box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);${c.phone ? 'box-shadow:0 0 0 14px #0c0a09,0 0 0 16px #3A332C,0 40px 120px rgba(0,0,0,.6);' : ''}`,
          g.root,
        );
        g.imgA = el(
          'img',
          'position:absolute;left:0;top:0;transform-origin:0 0;max-width:none',
          g.cardEl,
        );
        if (g.kind === 'split') {
          g.clip = el(
            'div',
            'position:absolute;inset:0;overflow:hidden',
            g.cardEl,
          );
          g.imgB = el(
            'img',
            'position:absolute;left:0;top:0;transform-origin:0 0;max-width:none',
            g.clip,
          );
          g.bar = el(
            'div',
            `position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:${C.brass}`,
            g.cardEl,
          );
        }
      }
      if (g.pill) {
        const css = `position:absolute;left:${g.pill.x}px;top:${g.pill.y}px;padding:14px 34px;border-radius:999px;background:#2A2420;color:${C.text};font:600 ${g.pill.size}px Geist;letter-spacing:.02em;border:1px solid #3A332C;opacity:0;white-space:nowrap`;
        g.pillEl = el('div', css, g.root, '');
        g.pillPrev = el('div', css, g.root, '');
      }
      if (g.kind === 'wordmark') {
        g.mark = el(
          'div',
          `position:absolute;left:0;right:0;top:${P ? 620 : 250}px;text-align:center;font:italic 300 ${P ? 230 : 300}px/1 Fraunces;color:${C.text};opacity:0`,
          g.root,
        );
        g.mark.innerHTML =
          'paldora<span style="color:' + C.brass + '">.</span>';
        g.tag = el(
          'div',
          `position:absolute;left:0;right:0;top:${P ? 940 : 620}px;text-align:center;font:500 ${P ? 46 : 44}px Geist;letter-spacing:.04em;color:${C.secondary};opacity:0`,
          g.root,
          cfg.endText,
        );
      }
    }

    function setImg(img, dir, idx, srcW, srcH, cardW, cardH, zoom, focus) {
      const url = `file://${cfg.frames}/${dir}/${String(idx).padStart(5, '0')}.jpg`;
      if (img.__u !== url) {
        img.src = url;
        img.__u = url;
      }
      const s = Math.max(cardW / srcW, cardH / srcH) * zoom;
      const w = srcW * s,
        h = srcH * s;
      const x = clamp(cardW / 2 - focus[0] * w, cardW - w, 0);
      const y = clamp(cardH / 2 - focus[1] * h, cardH - h, 0);
      img.style.width = `${srcW}px`;
      img.style.height = `${srcH}px`;
      img.style.transform = `translate(${x}px,${y}px) scale(${s})`;
    }

    const frameIdx = (shot, t) =>
      Math.max(
        0,
        Math.floor((t - shot.t0) * cfg.fps * (shot.speed || 1)) + shot.start,
      );
    const reveal = (lt, at) => smooth(clamp((lt - at) / RV)); // soft ease, no overshoot

    function update(g, t) {
      const lt = t - g.t0;
      const beat = cfg.beat;
      // phrase batches: fade in and drift up a few pixels together
      if (g.kind === 'replace') {
        g.w.forEach((w, i) => {
          const start = i * beat;
          const inn = smooth(clamp((lt - start) / 0.45));
          const out = 1 - smooth(clamp((lt - (start + beat - 0.3)) / 0.3));
          w.span.style.opacity = String(inn * out);
          w.span.style.transform = `translateY(${(1 - inn) * 12}px)`;
        });
      } else {
        for (const w of g.w) {
          const e = reveal(lt, w.at);
          w.span.style.opacity = String(e);
          w.span.style.transform = `translateY(${(1 - e) * 14}px)`;
        }
      }
      if (g.subEl) {
        const e = reveal(lt, g.sub.at);
        g.subEl.style.opacity = String(e);
        g.subEl.style.transform = `translateY(${(1 - e) * 10}px)`;
      }
      if (g.shots) {
        const shot =
          g.shots.find((s) => t >= s.t0 && t < s.t1) ||
          g.shots[g.shots.length - 1];
        const su = clamp((t - shot.t0) / (shot.t1 - shot.t0));
        const zoom = shot.z0 + (shot.z1 - shot.z0) * smooth(su);
        const idx = Math.min(frameIdx(shot, t), shot.count - 1);
        if (g.kind === 'split') {
          const wipe = 1 - 0.5 * smooth(clamp(lt / 0.9));
          setImg(
            g.imgA,
            shot.dir,
            idx,
            shot.srcW,
            shot.srcH,
            g.card.w,
            g.card.h,
            zoom,
            shot.focus,
          );
          setImg(
            g.imgB,
            shot.dirB,
            idx,
            shot.srcW,
            shot.srcH,
            g.card.w,
            g.card.h,
            zoom,
            shot.focus,
          );
          g.clip.style.clipPath = `inset(0 0 0 ${wipe * 100}%)`;
          g.bar.style.left = `${wipe * 100}%`;
        } else if (g.kind !== 'themes')
          setImg(
            g.imgA,
            shot.dir,
            idx,
            shot.srcW,
            shot.srcH,
            g.card.w,
            g.card.h,
            zoom,
            shot.focus,
          );
        if (g.kind !== 'themes')
          g.cardEl.style.transform = `translateY(${(1 - smooth(clamp(lt / 0.7))) * 14}px)`;
      }
      if (g.kind === 'themes') {
        const slotLen = beat / 2;
        const slot = Math.min(g.slots - 1, Math.floor(lt / slotLen));
        const k = g.order[slot];
        const sh = g.shots[0];
        setImg(
          g.imgA,
          sh.dir,
          k,
          sh.srcW,
          sh.srcH,
          g.card.w,
          g.card.h,
          1 + 0.04 * ((lt % slotLen) / slotLen),
          sh.focus,
        );
        // name pills crossfade (new in, previous out) instead of snapping
        const p = smooth(clamp((lt - slot * slotLen) / 0.16));
        g.pillEl.textContent = cfg.themeNames[k];
        g.pillEl.style.opacity = String(slot === 0 ? p : p);
        if (slot > 0) {
          g.pillPrev.textContent = cfg.themeNames[g.order[slot - 1]];
          g.pillPrev.style.opacity = String(1 - p);
        }
      }
      if (g.kind === 'wordmark') {
        const e = smooth(clamp(lt / 0.8));
        g.mark.style.opacity = String(e);
        g.mark.style.transform = `translateY(${(1 - e) * 14}px)`;
        const te = reveal(lt, 2 * beat);
        g.tag.style.opacity = String(te);
        g.tag.style.transform = `translateY(${(1 - te) * 10}px)`;
        els.glow.style.opacity = String(0.1 * (1 - smooth(clamp(lt / 1.2))));
      }
    }

    window.frame = async (t) => {
      const beat = cfg.beat;
      const ph = (t % beat) / beat;
      els.ring.style.opacity = String(
        0.07 * (1 - ph) ** 2 * (t > cfg.dropT ? 1 : 0.5),
      );
      els.ring.style.transform = `scale(${0.8 + 0.4 * smooth(ph)})`;
      els.stars.forEach((s, i) => {
        s.style.transform = `rotate(${t * 14 * (i % 2 ? 1 : -1)}deg) scale(${1 + 0.12 * Math.sin(t * 1.5 + i)})`;
      });
      els.glow.style.opacity = '0';
      const decodes = [];
      cfg.groups.forEach((g, gi) => {
        const first = gi === 0;
        const last = gi === cfg.groups.length - 1;
        const active = t >= g.t0 && t < g.t1 + (last ? 0 : 0.3);
        if (!active) {
          if (g.root) g.root.style.display = 'none';
          return;
        }
        if (!g.root) build(g);
        g.root.style.display = 'block';
        g.root.style.zIndex = String(gi);
        const fin = first ? 1 : smooth(clamp((t - g.t0) / XF));
        const fout = last ? 1 : 1 - smooth(clamp((t - g.t1) / 0.3));
        g.root.style.opacity = String(fin * fout);
        update(g, t);
        decodes.push(g.imgA, g.imgB);
      });
      els.black.style.opacity = String(clamp((t - (cfg.total - 0.7)) / 0.7));
      await Promise.all(
        decodes.filter(Boolean).map((i) => i.decode().catch(() => {})),
      );
    };
  </script>
</body>

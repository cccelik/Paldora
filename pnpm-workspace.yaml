# legacy/ is the frozen reference build and is intentionally not a workspace
# member. Native apps (apps/ios, apps/android) are built by Xcode and Gradle.
packages:
  - apps/web
  - apps/firebase-functions
  - packages/domain
  - packages/firebase-native
  - packages/firebase-prototype
  - packages/firebase-trusted
  - packages/personalization
  - packages/tokens
  - packages/validation

# Keep Firebase Admin's optional peers on the same reviewed release as the SDK.
overrides:
  '@firebase/app': 0.16.3
  '@firebase/app-compat': 0.5.19

allowBuilds:
  # Optional web config injection is not needed for the server-side prototype.
  '@firebase/util': false
  esbuild: true
  # Firebase CLI's protobufjs postinstall is optional for its generated runtime.
  protobufjs: false
  # Firebase CLI runs the emulator without the optional native RE2 build.
  re2: false
  # sharp loads prebuilt @img/* binaries; its source-build script never needs to run.
  sharp: false
